# Statik site — nginx root = __REPO_DIR__
# Kurulum: deploy/audit.fdanalyzer.sh setup

server {
    listen 80;
    listen [::]:80;
    server_name audit.fdanalyzer.com;

    root __REPO_DIR__;
    index index.html;

    access_log /var/log/nginx/audit.fdanalyzer.com.access.log;
    error_log /var/log/nginx/audit.fdanalyzer.com.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml font/woff2;

    location ^~ /deploy/ {
        deny all;
        return 404;
    }

    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?|txt|map)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
